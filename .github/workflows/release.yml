name: Release

# Push a tag such as v2.0.0 (it must match version.py) to build the Windows and
# macOS apps and attach them to a GitHub release.
# A pull request into main builds and self-tests both apps without publishing,
# and so does "Run workflow" on the Actions tab (once this file is on main).
on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same pull request replaces its still-running build.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            asset: MultiLangOCR-windows-x64.zip
          - name: macos
            os: macos-latest # Apple Silicon; the check below fails the build if that ever changes
            asset: MultiLangOCR-macos-arm64.zip

    steps:
      - uses: actions/checkout@v4

      - name: Check this is an Apple Silicon runner (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "Runner architecture: $(uname -m)"
          test "$(uname -m)" = "arm64"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Check the tag matches version.py
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION=$(python -c "from version import VERSION; print(VERSION)")
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version.py ($VERSION)"
            exit 1
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt

      - name: Build
        run: pyinstaller packaging/MultiLangOCR.spec --noconfirm

      # --- macOS ---------------------------------------------------------------
      # Unsigned apps from the internet are blocked unless they carry at least an
      # ad-hoc signature (the README explains "Open Anyway" for users).
      - name: Ad-hoc sign (macOS)
        if: runner.os == 'macOS'
        run: |
          codesign --force --deep --sign - dist/MultiLangOCR.app
          codesign --verify --deep --strict dist/MultiLangOCR.app

      - name: Self-test the built app (macOS)
        if: runner.os == 'macOS'
        run: |
          REPORT="$RUNNER_TEMP/selftest.txt"
          set +e
          dist/MultiLangOCR.app/Contents/MacOS/MultiLangOCR --self-test "$REPORT"
          STATUS=$?
          set -e
          cat "$REPORT"
          exit $STATUS

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/MultiLangOCR.app "${{ matrix.asset }}"

      # --- Windows -------------------------------------------------------------
      # The app is a windowed program, so run it with Start-Process -Wait to get
      # its exit code, and read the report it writes to a file.
      - name: Self-test the built app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP "selftest.txt"
          $p = Start-Process -FilePath "dist\MultiLangOCR\MultiLangOCR.exe" -ArgumentList "--self-test", "`"$report`"" -Wait -PassThru
          if (Test-Path $report) { Get-Content $report } else { Write-Host "The app wrote no self-test report." }
          if ($p.ExitCode -ne 0) { throw "Self-test failed with exit code $($p.ExitCode)" }

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist\MultiLangOCR -DestinationPath "${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to create the release
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
          body: |
            **Windows:** unzip `MultiLangOCR-windows-x64.zip` and run `MultiLangOCR.exe`.
            **macOS (Apple Silicon, macOS 14+):** unzip `MultiLangOCR-macos-arm64.zip`, drag `MultiLangOCR.app` to Applications, then follow the
            "Open Anyway" and permission steps in the [README](https://github.com/${{ github.repository }}#macos-first-launch).
            The builds are unsigned, so Windows SmartScreen and macOS Gatekeeper will warn on first run.
